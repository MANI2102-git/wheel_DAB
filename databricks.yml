bundle:
  name: hrdp

include:
  - resources/*.yml

resources:
  jobs:
    hrdp_data_quality_job:
      name: "[${bundle.target}] HRDP Data Quality Job"

      tasks:
        - task_key: run_data_quality

          python_wheel_task:
            package_name: hrdp
            entry_point: run

          libraries:
            - whl: ../dist/*.whl

artifacts:
  default:
    type: whl
    build: python -m pip install build && python -m build --wheel
    path: .

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  test:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}