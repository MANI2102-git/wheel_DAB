[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrdp"
version = "0.1.0"
description = "Databricks data engineering project"
requires-python = ">=3.10"
dependencies = [
    "pyspark",
    "requests",
    "pandas"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]